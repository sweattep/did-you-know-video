name: generate-video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - run: sudo apt-get update

      - run: |
          sudo apt-get install -y \
            ffmpeg \
            espeak-ng

      - run: go run main.go

      - uses: actions/upload-artifact@v4
        with:
          name: wikipedia-video
          path: |
            output.mp4
            script.txt
